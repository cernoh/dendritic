modelRoles:
  task: opencode-go/muse-spark-1.2-contributor
  plan: opencode-go/deepseek-v4-flash
  slow: opencode-go/deepseek-v4-flash
  vision: opencode-go/deepseek-v4-flash-vision-exp
  default: opencode-go/muse-spark-1.2-contributor
  advisor: opencode-go/muse-spark-1.2-contributor
providers:
  tinyModel: lfm2-350m
  tinyModelDevice: gpu
symbolPreset: nerd
theme:
  dark: dark-catppuccin
setupVersion: 2
hideThinkingBlock: true
memory:
  backend: "off"
autolearn:
  enabled: true
  autoContinue: true
bash:
  autoBackground:
    enabled: true
bashInterceptor:
  enabled: true
shellMinimizer:
  sourceOutlineLevel: default
github:
  enabled: true
mcp:
  {}
task:
  eager: default
  isolation:
    mode: auto
  agentAdvisor:
    task: "on"
advisor:
  enabled: true
  syncBacklog: "5"
steeringMode: one-at-a-time
compaction:
  handoffSaveToDisk: true
browser:
  headless: false
defaultThinkingLevel: auto
dev:
  autoqaConsent: granted
includeWorkspaceTree: true
features:
  unexpectedStopDetection: smart
edit:
  mode: hashline
lsp:
  formatOnWrite: true
astGrep:
  enabled: true
composer:
  shape: rule
statusLine:
  preset: nerd
  separator: pipe
  transparent: true
  compactThinkingLevel: true
terminal:
  showProgress: true