  slow: opencode-go/deepseek-v4-flash
  advisor: openrouter/nvidia/nemotron-3.5-lightning:free
providers: 
  tinyModel: lfm2-350m
  tinyModelDevice: gpu
symbolPreset: nerd
theme: 
  dark: dark-catppuccin
setupVersion: 1
