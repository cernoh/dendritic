id = "cernoh/mirai"
name = "Mirai"
version = "1.0.0"
plugin_api = 24
author = "cernoh"
license = "MIT"
tags = ["miracast", "cast", "display", "sink", "network"]
icon = "cast"
description = "Miracast from the shell: cast this desktop to a wireless display, and receive a device on it."

[[service]]
id = "mirai"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

[[shortcut]]
id = "toggle"
entry = "shortcut.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 430
height = 660
placement = "attached"
keyboard_focus = "exclusive"

# Plugin-level settings, so the service and the panel read the same values.
[[setting]]
key = "binary"
type = "string"
label_key = "settings.binary.label"
description_key = "settings.binary.description"
default = "mirai"

[[setting]]
key = "socket"
type = "string"
label_key = "settings.socket.label"
description_key = "settings.socket.description"
default = ""

[[setting]]
key = "poll_seconds"
type = "int"
min = 1
max = 30
label_key = "settings.poll.label"
description_key = "settings.poll.description"
default = 2

[[setting]]
key = "scan_seconds"
type = "int"
min = 3
max = 60
label_key = "settings.scan.label"
description_key = "settings.scan.description"
default = 10
