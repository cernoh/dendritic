id = "cernoh/terminal"
name = "Terminal"
version = "2.1.1"
plugin_api = 21
author = "cernoh"
license = "MIT"
tags = ["terminal", "shell", "productivity"]
icon = "terminal-2"
description = "A themed dropdown terminal pane, backed by libghostty-vt."

[[service]]
id = "shell"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

[[shortcut]]
id = "toggle"
entry = "shortcut.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 1200
height = 720
placement = "attached"
keyboard_focus = "exclusive"
dismiss_on_outside_click = false

# The panel has no visible command box. Printable chords are converted to PTY
# input by panel.luau; control chords are encoded by ghostty-term. The names
# follow XKB keysym names accepted by Noctalia's key chord parser.
# Escape remains the panel-close action and cannot be captured.
capture_keys = [
  "enter",
  "tab",
  "shift+tab",
  "backspace",
  "del",
  "up",
  "down",
  "left",
  "right",
