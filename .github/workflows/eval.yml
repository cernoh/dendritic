# Ensures every commit evaluates: whole-flake composition checks plus deep
# per-host strict evaluation against machine-neutral stubs.
#
# Why stubs come first?
#   - `nix flake check --impure` covers module composition (merging, packages,
#     devshells). Depending on the Nix version it may also force
#     nixosConfigurations toplevels, so it must run with stubs already seeded.
#   - Per-host `system.build.toplevel.drvPath` evaluation forces every option
#     value through derivation strictification, catching typos, conflicts and
#     broken wiring that lazy composition hides until rebuild day.
#
# Hosts import /etc/nixos/hardware-configuration.nix only when present (voidarc
# guard in modules/system/core/default.nix), and ASAHI pins its ESP firmware
# path /boot/vendorfw (see modules/system/drivers/asahi.nix). CI seeds
# machine-neutral stand-ins for both so every host evaluates on any runner:
# .github/stubs/hardware-configuration.nix plus an empty readable vendorfw dir.

name: Eval

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Evaluate flake
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Hosts import /etc/nixos/hardware-configuration.nix only when present
      # (voidarc guard in modules/system/core/default.nix) and ASAHI pins its
      # ESP firmware path, so BOTH gates below need these stand-ins in place
      # before any evaluation runs. Empty dir is enough for vendorfw: eval
      # only stats the pinned path during derivation strictification;
      # extraction runs at build time on the Mac.
      - name: Seed machine-neutral eval stubs
        run: |
          sudo mkdir -p /etc/nixos /boot/vendorfw
          sudo install -m 644 .github/stubs/hardware-configuration.nix \
            /etc/nixos/hardware-configuration.nix

      - name: Whole-flake check
        run: nix flake check --impure

      # Discover hosts dynamically so new nixosConfigurations are covered
      # automatically; no matrix to keep in sync. Names arrive
      # newline-separated straight from Nix — no JSON mangling in bash.
      - name: Strict-evaluate each host configuration
        run: |
          status=0
          names="$(nix eval --impure --raw '.#nixosConfigurations' \
            --apply 'ns: builtins.concatStringsSep "\n" (builtins.attrNames ns)')"
          while IFS= read -r host; do
            [ -n "$host" ] || continue
            echo "::group::nixosConfigurations.$host"
            nix eval --impure ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath" || status=1
            echo "::endgroup::"
          done <<< "$names"
          exit $status
