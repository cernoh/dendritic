name: Update flake lock

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# `pull-requests: write` alone is not enough: GitHub blocks GITHUB_TOKEN from
# creating a pull request unless the repository setting
# `can_approve_pull_request_reviews` is true. With it false, this job runs
# `nix flake update`, then dies at the last step with
# "GitHub Actions is not permitted to create or approve pull requests"
# (issue #175). Check the setting with:
#   gh api repos/<owner>/<repo>/actions/permissions/workflow
jobs:
  update:
    name: Update flake.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      # GitHub does not run workflows on a PR that GITHUB_TOKEN opened, so the
      # bump in the new PR arrives unvalidated. Close and re-open the PR to
      # start `Nix CI` and `Nix quality` on it.
      - name: Open update pull request
        uses: DeterminateSystems/update-flake-lock@v27
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-flake-lock
          pr-title: 'chore: update flake inputs'
          git-author-name: github-actions[bot]
          git-author-email: 41898282+github-actions[bot]@users.noreply.github.com
          git-committer-name: github-actions[bot]
          git-committer-email: 41898282+github-actions[bot]@users.noreply.github.com
