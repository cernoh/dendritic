name: Nix quality

on:
  pull_request:
    paths:
      - '**/*.nix'
      - 'flake.lock'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '**/*.nix'
      - 'flake.lock'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  nix-quality:
    name: Format Nix (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v16
      # Magic Nix Cache is sunset upstream; these are eval-only jobs, so no
      # binary-cache acceleration is wired up.
      - name: Find changed Nix files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.event.repository.default_branch }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD^"
          else
            base="${{ github.event.before }}"
          fi
          files=$(git diff --name-only "$base" "${{ github.sha }}" -- '*.nix' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: Check formatting
        if: steps.changed.outputs.files != ''
        run: nix run nixpkgs#nixfmt-rfc-style -- --check ${{ steps.changed.outputs.files }}
      - name: No changed Nix files
        if: steps.changed.outputs.files == ''
        run: echo 'No changed Nix files; quality checks skipped.'
