name: Issue
description: Report a bug or request a change. Write the text in Simplified Technical English.
title: "[area]: short summary"
body:
  - type: markdown
    attributes:
      value: |
        Write in Simplified Technical English (STE). Use short words and
        active voice. One sentence per idea. Max 20 words per sentence.
        No semicolons, no contractions, no marketing words.
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Bug
        - Feature
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is the problem?
      description: State what is wrong. Add steps to reproduce for a bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What do you expect?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Other context
      description: Add logs or config, if useful. Code blocks do not get linted.
  - type: checkboxes
    id: ste
    attributes:
      label: STE compliance
      options:
        - label: I confirm this text passes the STE linter.
          required: true
